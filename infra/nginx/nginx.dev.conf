worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS. The 'valid' TTL lets nginx re-resolve container
  # names if a service restarts on a different IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream auth_upstream {
    server auth-service:4000;
  }

  upstream backend_upstream {
    server backend:3000;
  }

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Reflect any localhost origin back as the CORS Access-Control-Allow-Origin
  # value. The frontend dev server runs at http://localhost:5173; this also
  # covers other ports devs use ad-hoc. Falls back to empty (no CORS header)
  # for non-localhost origins.
  map $http_origin $cors_origin {
    default "";
    "~^https?://localhost(:[0-9]+)?$" $http_origin;
  }

  server {
    listen 80;
    server_name _;

    # ---------- PUBLIC: auth routes pass straight through ----------
    location /auth/ {
      # CORS preflight: short-circuit before proxying. Browsers send this
      # for cross-origin POSTs with Content-Type: application/json.
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Max-Age       86400 always;
        add_header Content-Length               0;
        add_header Content-Type                 "text/plain";
        return 204;
      }
      add_header Access-Control-Allow-Origin $cors_origin always;
      proxy_pass http://auth_upstream;
    }

    # ---------- INTERNAL: nginx auth_request subrequest target ----------
    location = /_verify {
      internal;
      proxy_pass              http://auth_upstream/auth/verify;
      proxy_pass_request_body off;
      proxy_set_header        Content-Length    "";
      proxy_set_header        X-Original-URI    $request_uri;
      proxy_set_header        X-Original-Method $request_method;
      # Explicitly forward the caller's Authorization header so the
      # JwtStrategy in auth-service can read the bearer token.
      proxy_set_header        Authorization     $http_authorization;
    }

    # ---------- PROTECTED: /api/* requires a valid JWT ----------
    location /api/ {
      # CORS preflight: short-circuit BEFORE auth_request so browsers can
      # preflight without sending a token (they don't send Authorization on
      # OPTIONS by design).
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Max-Age       86400 always;
        add_header Content-Length               0;
        add_header Content-Type                 "text/plain";
        return 204;
      }

      auth_request        /_verify;
      auth_request_set    $auth_user_id    $upstream_http_x_user_id;
      auth_request_set    $auth_user_email $upstream_http_x_user_email;

      # Strip the /api prefix before forwarding (so /api/foo -> /foo).
      rewrite             ^/api/?(.*)$ /$1 break;

      proxy_pass          http://backend_upstream;
      proxy_set_header    X-User-Id    $auth_user_id;
      proxy_set_header    X-User-Email $auth_user_email;
      # Gateway is the trust boundary — backend never sees the raw token.
      proxy_set_header    Authorization "";

      add_header Access-Control-Allow-Origin $cors_origin always;
    }

    error_page 401 = @error401;
    location @error401 {
      # 401s on /api/* still need the CORS header so the browser surfaces the
      # JSON body to JS instead of opaque "TypeError: Failed to fetch".
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Content-Type                application/json always;
      return 401 '{"statusCode":401,"message":"Unauthorized"}';
    }
  }
}

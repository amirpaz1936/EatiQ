# EatiQ — host nginx site config for eatiq.cs.colman.ac.il.
#
# This runs on the VM HOST's own nginx (NOT in docker). It terminates TLS, serves
# the built SPA from disk, and reverse-proxies the API to the dockerized backend /
# auth-service, which docker-compose.prod.yml publishes on loopback (127.0.0.1).
#
# Install (Debian/Ubuntu nginx):
#   sudo cp infra/nginx/eatiq.host.conf /etc/nginx/sites-available/eatiq.conf
#   sudo ln -s /etc/nginx/sites-available/eatiq.conf /etc/nginx/sites-enabled/eatiq.conf
#   sudo nginx -t && sudo systemctl reload nginx
# (RHEL/CentOS: drop it in /etc/nginx/conf.d/eatiq.conf instead.)

# ---------- HTTP: redirect everything to HTTPS ----------
server {
  listen 80;
  listen [::]:80;
  server_name eatiq.cs.colman.ac.il;
  return 301 https://$host$request_uri;
}

# ---------- HTTPS: the only real entrypoint ----------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name eatiq.cs.colman.ac.il;

  # Domain certificates on the host. If browsers report an incomplete chain,
  # concatenate any intermediate/CA bundle after the leaf in CSB.crt.
  ssl_certificate     /etc/ssl/cs/CSB.crt;
  ssl_certificate_key /etc/ssl/cs/myserver.key;

  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1h;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Built SPA, published here by `npm run docker:prod:frontend`.
  # Must match FRONTEND_DIST_DIR in .env.prod.
  root  /var/www/eatiq;
  index index.html;

  # Meal images upload straight to R2 from the browser, so nginx only proxies JSON.
  client_max_body_size 10m;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # ---------- INTERNAL: nginx auth_request subrequest target ----------
  location = /_verify {
    internal;
    proxy_pass              http://127.0.0.1:4000/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length    "";
    proxy_set_header        X-Original-URI    $request_uri;
    proxy_set_header        X-Original-Method $request_method;
    # Forward the caller's bearer token so auth-service's JwtStrategy can read it.
    proxy_set_header        Authorization     $http_authorization;
  }

  # ---------- SPA route: /auth/callback is handled by the frontend ----------
  # The Google flow redirects the browser to /auth/callback?token=..., which the
  # React app reads. It must be served by the SPA, NOT proxied to auth-service.
  # This exact match wins over the /auth/ prefix below (which still catches
  # /auth/google/callback and the rest of the real auth API).
  location = /auth/callback {
    try_files /index.html =404;
  }

  # ---------- PUBLIC: auth API (dockerized auth-service on loopback) ----------
  location /auth/ {
    proxy_pass http://127.0.0.1:4000;
  }

  # ---------- PROTECTED: /api/* requires a valid JWT ----------
  location /api/ {
    auth_request     /_verify;
    auth_request_set $auth_user_id    $upstream_http_x_user_id;
    auth_request_set $auth_user_email $upstream_http_x_user_email;

    # Strip the /api prefix before forwarding (so /api/foo -> /foo).
    rewrite          ^/api/?(.*)$ /$1 break;

    proxy_pass       http://127.0.0.1:3000;
    proxy_set_header X-User-Id    $auth_user_id;
    proxy_set_header X-User-Email $auth_user_email;
    # Gateway is the trust boundary — backend never sees the raw token.
    proxy_set_header Authorization "";
  }

  # ---------- Frontend SPA: static files with history fallback ----------
  location / {
    try_files $uri $uri/ /index.html;
  }

  error_page 401 = @error401;
  location @error401 {
    add_header Content-Type application/json always;
    return 401 '{"statusCode":401,"message":"Unauthorized"}';
  }
}
